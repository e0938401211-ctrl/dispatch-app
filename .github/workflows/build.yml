# 每次 main.dart 更新，GitHub 會自動把 App 打包成網頁版並發佈
name: Build and deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 頁面手動按執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 建立專案並放入 main.dart
        run: |
          flutter create --platforms web --project-name dispatch_app app
          cp main.dart app/lib/main.dart
          # 把 App 名稱改成 金爵國際（加入主畫面時顯示的名字）
          sed -i 's/"name": "dispatch_app"/"name": "金爵國際"/; s/"short_name": "dispatch_app"/"short_name": "金爵國際"/' app/web/manifest.json
          sed -i 's/content="dispatch_app"/content="金爵國際"/; s#<title>dispatch_app</title>#<title>金爵國際</title>#' app/web/index.html

      - name: 打包網頁版
        working-directory: app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: 上傳打包結果
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發佈到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

